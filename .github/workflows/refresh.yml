name: Refresh Market Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull latest market data
        run: python polymarket_pull_nopandas.py

      - name: Rebuild dashboard
        run: python rebuild_dashboard.py

      - name: Clean up CSV
        run: rm -f polymarket_active_*.csv

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet index.html; then
            echo "No changes to index.html, skipping commit."
            exit 0
          fi

          git add index.html
          git commit -m "Refresh market data — $(date -u +'%Y-%m-%d %H:%M:%S') UTC"

          # Push with rebase + retry on race condition
          for i in {1..3}; do
            if git push origin main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push failed (attempt $i/3), rebasing and retrying..."
            git pull --rebase origin main
          done

          echo "Push failed after 3 retries."
          exit 1
